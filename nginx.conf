server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (or any client-side router) support — any path that
    # isn't a real file falls back to index.html so the app's own router
    # handles it, instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic caching for hashed build assets (CRA/Vite both fingerprint
    # filenames on build, so long-cache is safe here).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ALB target group health check hits "/" by default (see
    # frontend-fargate.tf's health_check block) — index.html returning
    # 200 satisfies it, no separate health endpoint needed.
}
